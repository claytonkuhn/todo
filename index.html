<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f11;--surface:#18181c;--surface2:#222228;--border:#2e2e38;--accent:#ff5c35;--urgent:#ff3b3b;--medium:#ff9f1c;--low:#4ade80;--text:#f0f0f2;--muted:#7a7a8a}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:32px 20px 60px}
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:20px}
.header h1{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.date{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.stats{display:flex;gap:16px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.stat-val{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}
.dump-zone{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.dump-zone:focus-within{border-color:var(--accent)}
.dump-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.dump-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}
textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;line-height:1.7;resize:none;min-height:90px}
textarea::placeholder{color:var(--muted)}
.dump-actions{display:flex;justify-content:flex-end;margin-top:10px;gap:10px}
.btn-clear{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;padding:6px 10px;text-transform:uppercase}
.btn-extract{background:var(--accent);color:white;border:none;padding:9px 20px;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-extract:disabled{opacity:0.5;cursor:not-allowed}
.quick-row{display:flex;gap:8px;margin-bottom:16px}
.quick-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none}
.quick-input:focus{border-color:var(--accent)}
.quick-input::placeholder{color:var(--muted)}
select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:11px;padding:10px;border-radius:8px;outline:none;cursor:pointer}
.btn-add{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:20px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:white}
.filter-btn.f-urgent.active{background:var(--urgent);border-color:var(--urgent)}
.filter-btn.f-medium.active{background:var(--medium);border-color:var(--medium);color:#111}
.filter-btn.f-low.active{background:var(--low);border-color:var(--low);color:#111}
.btn-cleardone{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:20px;font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;text-transform:uppercase}
.group{margin-bottom:24px}
.group-header{font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:700}
.group-line{flex:1;height:1px;background:var(--border)}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:8px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.task.done{opacity:0.4}
.task-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:bold}
.task-check.checked{background:var(--accent);border-color:var(--accent)}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;line-height:1.5;color:var(--text);font-weight:500}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
.tag-urgent{background:rgba(255,59,59,0.12);color:var(--urgent)}
.tag-medium{background:rgba(255,159,28,0.12);color:var(--medium)}
.tag-low{background:rgba(74,222,128,0.12);color:var(--low)}
.tag-source{background:rgba(255,255,255,0.06);color:var(--muted);font-weight:500}
.task-date{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.task-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;opacity:0}
.task:hover .task-delete{opacity:1}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;line-height:1.8}
.empty-big{font-size:18px;font-weight:800;color:var(--surface2);display:block;margin-bottom:8px}
.loading-bar{height:2px;background:linear-gradient(90deg,var(--accent),#ffb347);border-radius:2px;margin-bottom:16px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.msg{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.msg-error{background:rgba(255,59,59,0.1);border:1px solid rgba(255,59,59,0.2);color:var(--urgent)}
.msg-success{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.2);color:var(--low)}
.spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>To-Do List</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="stats">
      <div><span class="stat-val" id="statOpen">0</span> open</div>
      <div><span class="stat-val" id="statDone">0</span> done</div>
      <div id="urgentStat" style="display:none;color:var(--urgent)"><span class="stat-val" id="statUrgent" style="color:var(--urgent)">0</span> urgent</div>
    </div>
  </div>

  <div class="dump-zone">
    <div class="dump-label"><span class="dump-dot"></span> Brain dump</div>
    <textarea id="dumpInput" rows="4" placeholder="Paste meeting notes, Slack threads, random thoughts... hit Extract Tasks and Claude organizes them"></textarea>
    <div class="dump-actions">
      <button class="btn-clear" onclick="document.getElementById('dumpInput').value=''">Clear</button>
      <button class="btn-extract" id="extractBtn" onclick="handleExtract()">&#9889; Extract Tasks</button>
    </div>
  </div>

  <div id="msgZone"></div>

  <div class="quick-row">
    <input class="quick-input" id="quickInput" placeholder="Quick add a task... (press Enter)" onkeydown="if(event.key==='Enter')handleQuickAdd()" />
    <select id="quickPriority">
      <option value="urgent">Urgent</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <select id="quickSource">
      <option value="personal">Personal</option>
      <option value="meeting">Meeting</option>
      <option value="slack">Slack</option>
      <option value="email">Email</option>
    </select>
    <button class="btn-add" onclick="handleQuickAdd()">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" id="f-all" onclick="setFilter('all')">All</button>
    <button class="filter-btn f-urgent" id="f-urgent" onclick="setFilter('urgent')">Urgent</button>
    <button class="filter-btn f-medium" id="f-medium" onclick="setFilter('medium')">Medium</button>
    <button class="filter-btn f-low" id="f-low" onclick="setFilter('low')">Low</button>
    <button class="filter-btn" id="f-done" onclick="setFilter('done')">Done</button>
    <button class="btn-cleardone" onclick="clearDone()">Clear done</button>
  </div>

  <div id="taskList"></div>
</div>

<script>
var STORAGE_KEY = 'claytodo_v1';
var tasks = [];
var currentFilter = 'all';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function todayStr(){ return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function srcLabel(s){ return {meeting:'Meeting',slack:'Slack',personal:'Personal',email:'Email'}[s]||s; }

function load(){ try{ var d=localStorage.getItem(STORAGE_KEY); tasks=d?JSON.parse(d):[]; }catch(e){ tasks=[]; } }
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }

function render(){
  document.getElementById('dateLabel').textContent=todayStr();
  var open=tasks.filter(function(t){return !t.done;});
  var done=tasks.filter(function(t){return t.done;});
  var urgent=open.filter(function(t){return t.priority==='urgent';});
  document.getElementById('statOpen').textContent=open.length;
  document.getElementById('statDone').textContent=done.length;
  document.getElementById('statUrgent').textContent=urgent.length;
  document.getElementById('urgentStat').style.display=urgent.length?'':'none';

  ['all','urgent','medium','low','done'].forEach(function(f){
    var el=document.getElementById('f-'+f);
    if(!el) return;
    var cls='filter-btn';
    if(f==='urgent') cls+=' f-urgent';
    if(f==='medium') cls+=' f-medium';
    if(f==='low') cls+=' f-low';
    if(currentFilter===f) cls+=' active';
    el.className=cls;
  });

  var visible=currentFilter==='done'?done:currentFilter==='all'?open:open.filter(function(t){return t.priority===currentFilter;});
  var list=document.getElementById('taskList');

  if(!tasks.length){
    list.innerHTML='<div class="empty-state"><span class="empty-big">Nothing here yet</span>Dump your brain above or quick-add a task.</div>';
    return;
  }
  if(!visible.length){
    list.innerHTML='<div class="empty-state"><span class="empty-big">All clear</span>No tasks in this view.</div>';
    return;
  }

  if(currentFilter==='all'){
    var groups=[
      {key:'urgent',label:'Urgent',color:'var(--urgent)',items:visible.filter(function(t){return t.priority==='urgent';})},
      {key:'medium',label:'Medium',color:'var(--medium)',items:visible.filter(function(t){return t.priority==='medium';})},
      {key:'low',label:'Low',color:'var(--low)',items:visible.filter(function(t){return t.priority==='low';})},
    ];
    list.innerHTML=groups.filter(function(g){return g.items.length;}).map(function(g){
      return '<div class="group"><div class="group-header" style="color:'+g.color+'">'+g.label+'<div class="group-line"></div><span style="font-size:10px;opacity:0.5">'+g.items.length+'</span></div>'+g.items.map(taskHTML).join('')+'</div>';
    }).join('');
  } else {
    list.innerHTML=visible.map(taskHTML).join('');
  }
}

function taskHTML(t){
  return '<div class="task'+(t.done?' done':'')+'" id="t-'+t.id+'">'
    +'<div class="task-check'+(t.done?' checked':'')+'" onclick="toggleDone(\''+t.id+'\')">'+(t.done?'&#10003;':'')+'</div>'
    +'<div class="task-body">'
    +'<div class="task-text">'+esc(t.text)+'</div>'
    +'<div class="task-meta">'
    +'<span class="tag tag-'+t.priority+'">'+t.priority+'</span>'
    +(t.source?'<span class="tag tag-source">'+srcLabel(t.source)+'</span>':'')
    +'<span class="task-date">'+fmtDate(t.createdAt)+'</span>'
    +'</div></div>'
    +'<button class="task-delete" onclick="deleteTask(\''+t.id+'\')">&#215;</button>'
    +'</div>';
}

function toggleDone(id){
  tasks=tasks.map(function(t){ return t.id===id?Object.assign({},t,{done:!t.done,doneAt:!t.done?new Date().toISOString():null}):t; });
  save(); render();
}
function deleteTask(id){ tasks=tasks.filter(function(t){return t.id!==id;}); save(); render(); }
function clearDone(){ tasks=tasks.filter(function(t){return !t.done;}); save(); render(); }
function setFilter(f){ currentFilter=f; render(); }

function handleQuickAdd(){
  var input=document.getElementById('quickInput');
  var priority=document.getElementById('quickPriority').value;
  var source=document.getElementById('quickSource').value;
  var text=input.value.trim();
  if(!text) return;
  tasks.unshift({id:uid(),text:text,priority:priority,source:source,done:false,createdAt:Date.now()});
  save(); input.value=''; render();
}

function showMsg(text,type){
  var z=document.getElementById('msgZone');
  z.innerHTML='<div class="msg msg-'+type+'">'+text+'</div>';
  setTimeout(function(){z.innerHTML='';},3000);
}

async function handleExtract(){
  var text=document.getElementById('dumpInput').value.trim();
  if(!text) return;
  var apiKey=localStorage.getItem('claytodo_apikey')||'';
  if(!apiKey){
    var key=prompt('Enter your Anthropic API key (stored locally only):');
    if(!key) return;
    localStorage.setItem('claytodo_apikey',key.trim());
    apiKey=key.trim();
  }
  var btn=document.getElementById('extractBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Extracting...';
  var bar=document.createElement('div'); bar.className='loading-bar'; bar.id='loadBar';
  document.getElementById('msgZone').appendChild(bar);
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:'Extract all action items from this brain dump. Return ONLY a JSON array, no markdown. Each item: {"text":"clear action","priority":"urgent|medium|low","source":"meeting|slack|personal|email"}.\nRules: urgent=blocking/today, medium=important-not-critical, low=someday.\nBrain dump:\n'+text}]})
    });
    var data=await res.json();
    var raw=data.content&&data.content[0]?data.content[0].text:'[]';
    var extracted=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(!extracted.length){ showMsg('No tasks found - try adding more detail','error'); }
    else{
      var newTasks=extracted.map(function(t){return {id:uid(),text:t.text,priority:['urgent','medium','low'].includes(t.priority)?t.priority:'medium',source:['meeting','slack','personal','email'].includes(t.source)?t.source:'personal',done:false,createdAt:Date.now()};});
      tasks=newTasks.concat(tasks);
      save();
      document.getElementById('dumpInput').value='';
      showMsg('Extracted '+newTasks.length+' tasks','success');
    }
  }catch(e){ showMsg('Error - check your API key','error'); }
  var lb=document.getElementById('loadBar'); if(lb) lb.remove();
  btn.disabled=false; btn.innerHTML='&#9889; Extract Tasks';
  render();
}

load(); render();
</script>
</body>
</html>
